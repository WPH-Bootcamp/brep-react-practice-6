<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 6 - Transition and Animation</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body>
    <h1>Materi 6 - Transition and Animation</h1>

    <button
      class="bg-blue-500 hover:bg-blue-700 hover:scale-105 hover:shadow-xl text-white px-6 py-2 transition duration-400 ease-in-out animate-spin [animation-duration:2s]"
    >
      Button
    </button>

    <div class="w-10 h-10 border-4 border-blue-500 rounded-full"></div>

    <video controls>
      <source type="mp4/video" />
    </video>

    <audio controls>
      <source type="mp3/music" />
    </audio>
  </body>
</html>
